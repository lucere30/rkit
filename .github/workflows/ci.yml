name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'examples/**'
      - 'custom/**'
      - 'lq/manual/**'
      - 'rkit.yaml'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: rkit check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Build from actual platform upstreams and assert split outputs
        run: |
          rkit build --output .rkit-stage || true
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          plan = json.loads(Path(".rkit-stage/plan.json").read_text())
          report = plan["report"]
          assert "proxy-merged" in report["successful"], report["failed"].get("proxy-merged")
          paths = set(plan["files"])
          expected = {"lq/generated/proxy-merged.list", "cat/proxy-merged.yaml",
                      "cat/proxy-merged-domain.yaml", "cat/proxy-merged-ip.yaml",
                      "cat/proxy-merged-classical.yaml"}
          assert expected <= paths, expected - paths
          assert not any("merged_rules" in p for p in paths)
          root = Path(".rkit-stage/files")
          loon = (root / "lq/generated/proxy-merged.list").read_text()
          assert "USER-AGENT," in loon, "Loon User-Agent rules were lost"
          domain = yaml.safe_load((root / "cat/proxy-merged-domain.yaml").read_text())["payload"]
          ip = yaml.safe_load((root / "cat/proxy-merged-ip.yaml").read_text())["payload"]
          classical = yaml.safe_load((root / "cat/proxy-merged-classical.yaml").read_text())["payload"]
          assert domain and ip and classical
          assert all("," not in value for value in domain + ip)
          assert all("," in value for value in classical)
          manifest_all = json.loads((root / "manifest.json").read_text())["rulesets"]
          assert "merged_rules" not in manifest_all
          manifest = manifest_all["proxy-merged"]
          loon_sources = [entry["source"] for entry in manifest["loon"]["inputs"]]
          mihomo_sources = [entry["source"] for entry in manifest["mihomo"]["inputs"]]
          assert len(loon_sources) == 6 and len(mihomo_sources) == 4
          assert not any("/Loon/Global/" in u or "/Clash/Global/" in u for u in loon_sources + mihomo_sources)
          assert all("/Loon/" in u or "/surge-rules/" in u for u in loon_sources)
          assert all("/Clash/" in u or "/clash-rules/" in u for u in mihomo_sources)
          print("Real upstream separation and Mihomo native split verified.")
          PY
      - name: Report real-upstream optimization delta
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import yaml
          for old in sorted(Path("cat").glob("*.yaml")) + sorted(Path("lq/generated").glob("*.list")):
              new = Path(".rkit-stage/files") / old
              if not new.exists():
                  continue
              if old.suffix == ".yaml":
                  a = set(yaml.safe_load(old.read_text())["payload"])
                  b = set(yaml.safe_load(new.read_text())["payload"])
              else:
                  a = {line for line in old.read_text().splitlines() if line and not line.startswith("#")}
                  b = {line for line in new.read_text().splitlines() if line and not line.startswith("#")}
              removed, added = sorted(a - b), sorted(b - a)
              if removed or added:
                  print(f"{old}: baseline={len(a)} new={len(b)} removed={len(removed)} added={len(added)}")
                  def rule_type(value):
                      if value.startswith("+."):
                          return "DOMAIN-SUFFIX"
                      if "," not in value:
                          return "DOMAIN"
                      return value.split(",", 1)[0]
                  print(" removed types:", dict(Counter(rule_type(v) for v in removed)))
                  print(" added types:", dict(Counter(rule_type(v) for v in added)))
                  print(" removed sample:", removed[:12])
                  print(" added sample:", added[:12])
          PY
      - name: Validate staged providers with pinned Mihomo
        run: python tools/validate_clients.py .rkit-stage
      - name: Reject invalid providers and verify documented DNS coverage
        env:
          RKIT_MIHOMO_BINARY: .rkit-cache/clients/mihomo
        run: python -m unittest discover -s tests -p test_validate_clients.py -v
