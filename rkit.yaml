# Enable/disable targets here; all outputs of one ruleset share one source snapshot.
version: 1
targets:
  loon: true
  mihomo: true
  singbox: false
rulesets:
  direct:
    sources:
    - path: lq/manual/direct.list
      format: classical
    targets:
    - loon
    - mihomo
    - singbox
  proxy:
    sources:
    - path: lq/manual/proxy.list
      format: classical
    targets:
    - loon
    - mihomo
    - singbox
  merged_rules:
    # Default uses Clash-native sources for Mihomo/sing-box; Loon overrides them.
    sources:
    - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ProxyLite/ProxyLite.list
      format: classical
    - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Proxy/Proxy.list
      format: classical
    - url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt
      format: clash-domain
    - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list
      format: classical
    sources_by_target:
      loon:
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ProxyLite/ProxyLite.list
        format: classical
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Proxy/Proxy.list
        format: classical
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Proxy/Proxy_Domain.list
        format: loon-domain
      - url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/gfw.txt
        format: classical
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GlobalMedia/GlobalMedia.list
        format: classical
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GlobalMedia/GlobalMedia_Domain.list
        format: loon-domain
    target_layouts:
      mihomo: native-split
    targets:
    - loon
    - mihomo
    - singbox
    collapse_ip: true
    omit:
      mihomo:
      - USER-AGENT
      - URL-REGEX
      singbox:
      - USER-AGENT
      - URL-REGEX
  # Compatibility output for existing subscriptions; keep during migration.
  proxy-merged:
    # Default uses Clash-native sources for Mihomo/sing-box; Loon overrides them.
    sources:
    - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ProxyLite/ProxyLite.list
      format: classical
    - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Proxy/Proxy.list
      format: classical
    - url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt
      format: clash-domain
    - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list
      format: classical
    sources_by_target:
      loon:
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ProxyLite/ProxyLite.list
        format: classical
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Proxy/Proxy.list
        format: classical
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Proxy/Proxy_Domain.list
        format: loon-domain
      - url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/gfw.txt
        format: classical
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GlobalMedia/GlobalMedia.list
        format: classical
      - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GlobalMedia/GlobalMedia_Domain.list
        format: loon-domain
    target_layouts:
      mihomo: native-split-dash
    targets:
    - loon
    - mihomo
    - singbox
    collapse_ip: true
    omit:
      mihomo:
      - USER-AGENT
      - URL-REGEX
      singbox:
      - USER-AGENT
      - URL-REGEX
  adlite:
    sources:
    - url: https://raw.githubusercontent.com/deezertidal/private/refs/heads/main/rule/ADLite.list
      format: classical
    targets:
    - loon
    - mihomo
    - singbox
    collapse_ip: false
    omit:
      mihomo:
      - USER-AGENT
      - URL-REGEX
      singbox:
      - USER-AGENT
      - URL-REGEX
  espn:
    sources:
    - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Espn/Espn_No_Resolve.yaml
      format: clash-classical
    additions: custom/espn.list
    targets:
    - loon
    - mihomo
    - singbox
  f1tv:
    sources:
    - url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/formula1.yaml
      format: clash-classical
    - url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/F1.list
      format: classical
      # Exact hosts only; do not import the broad brand/circuit/shared-service suffixes.
      include_types:
      - DOMAIN
    additions: custom/f1tv.list
    targets:
    - loon
    - mihomo
    - singbox
  bitget:
    sources:
    - url: https://raw.githubusercontent.com/uhovohu/clash/main/Rules/bitget.yaml
      format: clash-domain
    additions: custom/bitget.list
    targets:
    - loon
    - mihomo
    - singbox
    exclusions: custom/bitget-exclude.list
  fakeip-filter:
    sources:
    - url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.list
      format: domain-list
    additions: custom/fakeip-filter.list
    targets:
    - mihomo
    purpose: fakeip
